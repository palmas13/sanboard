name: Lifecycle Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing-purge:
    name: Listing purge (every 5 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SANBOARD_PRODUCTION_URL: ${{ vars.SANBOARD_PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          test -n "$SANBOARD_PRODUCTION_URL" || { echo "Missing repository variable: SANBOARD_PRODUCTION_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          [[ "$SANBOARD_PRODUCTION_URL" == https://* ]] || { echo "SANBOARD_PRODUCTION_URL must use HTTPS"; exit 1; }
      - name: Call listing purge worker
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "${SANBOARD_PRODUCTION_URL%/}/api/internal/listing-purge"

  media-cleanup:
    name: Media cleanup (every 5 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SANBOARD_PRODUCTION_URL: ${{ vars.SANBOARD_PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          test -n "$SANBOARD_PRODUCTION_URL" || { echo "Missing repository variable: SANBOARD_PRODUCTION_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          [[ "$SANBOARD_PRODUCTION_URL" == https://* ]] || { echo "SANBOARD_PRODUCTION_URL must use HTTPS"; exit 1; }
      - name: Call media cleanup worker
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "${SANBOARD_PRODUCTION_URL%/}/api/internal/media-cleanup"

  expiry-lifecycle:
    name: Expiry lifecycle (every 10 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SANBOARD_PRODUCTION_URL: ${{ vars.SANBOARD_PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          test -n "$SANBOARD_PRODUCTION_URL" || { echo "Missing repository variable: SANBOARD_PRODUCTION_URL"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing repository secret: CRON_SECRET"; exit 1; }
          [[ "$SANBOARD_PRODUCTION_URL" == https://* ]] || { echo "SANBOARD_PRODUCTION_URL must use HTTPS"; exit 1; }
      - name: Call expiry lifecycle worker
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Accept: application/json" \
            "${SANBOARD_PRODUCTION_URL%/}/api/internal/expiry-lifecycle"
